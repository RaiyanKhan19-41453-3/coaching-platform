name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Containerized tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite (SDK container + Testcontainers)
        run: ./scripts/run-tests.sh

  build:
    name: Build images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t coaching-api:${{ github.sha }} -f src/CoachingPlatform.Api/Dockerfile .
      - name: Build Web image
        run: docker build -t coaching-web:${{ github.sha }} ./web
      - name: Smoke test API image
        run: |
          docker network create ci-smoke || true
          docker run -d --name ci-db --network ci-smoke -e POSTGRES_PASSWORD=test -e POSTGRES_DB=coaching postgres:17-alpine
          docker run -d --name ci-cache --network ci-smoke redis:7-alpine
          docker run -d --name ci-api --network ci-smoke -p 18081:8080 \
            -e ConnectionStrings__Default='Host=ci-db;Database=coaching;Username=postgres;Password=test' \
            -e ASPNETCORE_ENVIRONMENT=Development coaching-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18081/health/ready >/dev/null; then echo ready; exit 0; fi
            sleep 2
          done
          docker logs ci-api
          exit 1

  publish:
    name: Publish images (main/tags)
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          API="ghcr.io/$OWNER/coaching-platform-api"
          WEB="ghcr.io/$OWNER/coaching-platform-web"
          docker build -t "$API:${{ github.sha }}" -f src/CoachingPlatform.Api/Dockerfile .
          docker build -t "$WEB:${{ github.sha }}" ./web
          docker push "$API:${{ github.sha }}"
          docker push "$WEB:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "$API:${{ github.sha }}" "$API:latest"
            docker tag "$WEB:${{ github.sha }}" "$WEB:latest"
            docker push "$API:latest"
            docker push "$WEB:latest"
          fi
