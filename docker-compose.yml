name: coaching-platform

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coaching}
      POSTGRES_USER: ${POSTGRES_USER:-coaching}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coaching}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coaching} -d ${POSTGRES_DB:-coaching}"]
      interval: 5s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/CoachingPlatform.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Database=${POSTGRES_DB:-coaching};Username=${POSTGRES_USER:-coaching};Password=${POSTGRES_PASSWORD:-coaching}"
      Redis__ConnectionString: "cache:6379"
      Jwt__Key: ${JWT_KEY:-dev-only-signing-key-change-this-in-production-1234}
      Jwt__Issuer: coaching-platform
      Jwt__Audience: coaching-web
      Jwt__AccessTokenMinutes: 30
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-coaching}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-coaching}
      Minio__Bucket: coaching
      Minio__PublicEndpoint: "http://localhost:${MINIO_PORT:-9000}"
      Cors__Origins__0: "http://localhost:${WEB_PORT:-13000}"

      # Optional observability
      Seq__ServerUrl: ${SEQ_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}

      # Optional email / SMS delivery (empty values = no-op)
      Messaging__SmtpHost: ${SMTP_HOST:-}
      Messaging__SmtpPort: ${SMTP_PORT:-587}
      Messaging__SmtpUser: ${SMTP_USER:-}
      Messaging__SmtpPassword: ${SMTP_PASSWORD:-}
      Messaging__FromAddress: ${SMTP_FROM:-noreply@coaching.local}
      Messaging__SmsWebhook: ${SMS_WEBHOOK:-}
    ports:
      - "${API_PORT:-18081}:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-13000}:80"

  minio:
    image: pipeforge-minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-coaching}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-coaching}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@coaching.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-coaching}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"

volumes:
  db-data:
  redis-data:
  minio-data:
  pgadmin-data:
